[project]
name = "oes-client"
version = "0.5.0"
description = "Playwright-klient til ØS Indsigt"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "authlib>=1.6.1",
    "httpx>=0.28.1",
    "playwright>=1.54.0",
    "pytest>=8.4.1",
]

[tool.uv.sources]

[dependency-groups]
dev = [
    "python-dotenv>=1.2.3",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oes_client"]
